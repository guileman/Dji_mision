<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJI Mission Planner - Surveyor Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --text: #ecf0f1;
        }

        body { 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #f0f2f5;
        }

        #sidebar { 
            width: 350px; 
            background: var(--primary); 
            color: var(--text); 
            padding: 20px; 
            overflow-y: auto; 
            box-shadow: 4px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        #map { flex-grow: 1; }

        h2 { font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 10px; }
        
        .control-group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            color: #bdc3c7;
        }

        input, select { 
            width: 100%; 
            padding: 10px; 
            border-radius: 5px; 
            border: 1px solid #34495e; 
            background: #34495e; 
            color: white;
            box-sizing: border-box;
        }

        .btn-stack { display: grid; gap: 10px; margin-top: 20px; }

        button { 
            padding: 12px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: opacity 0.2s;
        }

        .btn-calc { background: var(--accent); color: white; }
        .btn-export { background: var(--success); color: white; }
        .btn-clear { background: var(--danger); color: white; }
        button:hover { opacity: 0.9; }

        .info-box {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Surveyor Mission Tool</h2>
    
    <div class="control-group">
        <label>Altura de Vuelo (m)</label>
        <input type="number" id="altitude" value="60">
    </div>

    <div class="control-group">
        <label>Distancia entre líneas (m) - Side Overlap</label>
        <input type="number" id="side_dist" value="25">
    </div>

    <div class="control-group">
        <label>Disparo cada (m) - Frontal Overlap</label>
        <input type="number" id="trigger_dist" value="15">
    </div>

    <div class="control-group">
        <label>Velocidad Crucero (m/s)</label>
        <input type="number" id="speed" value="5">
    </div>

    <div class="btn-stack">
        <button class="btn-calc" onclick="generateFlightPath()">1. Calcular Rutas</button>
        <button class="btn-export" onclick="exportKML()">2. Exportar KML para DJI</button>
        <button class="btn-clear" onclick="resetApp()">Limpiar Todo</button>
    </div>

    <div class="info-box">
        <strong>Instrucciones:</strong><br>
        1. Haz clic en el mapa para definir el polígono del área.<br>
        2. Ajusta los parámetros de solape.<br>
        3. Genera y descarga el archivo para tu Smart Controller.
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
    // Inicializar mapa (Centrado en una posición inicial)
    const map = L.map('map').setView([-32.959, -60.758], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let coords = [];
    let polygonLayer = L.polygon([], {color: '#3498db', weight: 2}).addTo(map);
    let flightLinesLayer = L.featureGroup().addTo(map);

    // Evento de clic para dibujar
    map.on('click', (e) => {
        coords.push([e.latlng.lng, e.latlng.lat]);
        updatePolygon();
    });

    function updatePolygon() {
        if(coords.length > 0) {
            polygonLayer.setLatLngs(coords.map(c => [c[1], c[0]]));
        }
    }

    function generateFlightPath() {
        if (coords.length < 3) {
            alert("Por favor, marca al menos 3 puntos en el mapa.");
            return;
        }

        flightLinesLayer.clearLayers();
        
        const spacingMeters = document.getElementById('side_dist').value;
        const spacingDegrees = spacingMeters / 111320; // Conversión aproximada a grados

        // Crear polígono Turf
        const poly = turf.polygon([[...coords, coords[0]]]);
        const bbox = turf.bbox(poly);

        // Generar rejilla de líneas
        const grid = turf.lineGrid(bbox, spacingMeters / 1000, {units: 'kilometers'});
        
        grid.features.forEach(line => {
            const intersect = turf.lineSplit(line, poly);
            intersect.features.forEach(segment => {
                // Verificar si el punto medio del segmento está dentro del polígono
                const mid = turf.midpoint(segment.geometry.coordinates[0], segment.geometry.coordinates[1]);
                if (turf.booleanPointInPolygon(mid, poly)) {
                    L.geoJSON(segment, {style: {color: '#f1c40f', weight: 3}}).addTo(flightLinesLayer);
                }
            });
        });
    }

    function exportKML() {
        const layers = flightLinesLayer.getLayers();
        if (layers.length === 0) {
            alert("Primero calcula las rutas de vuelo.");
            return;
        }

        const alt = document.getElementById('altitude').value;
        const dist = document.getElementById('trigger_dist').value;
        const speed = document.getElementById('speed').value;

        let kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Misión Surveyor DJI</name>
    <description>Generado por Herramienta Estática</description>`;

        layers.forEach((layer, index) => {
            const lineCoords = layer.toGeoJSON().geometry.coordinates;
            const kmlCoords = lineCoords.map(c => `${c[0]},${c[1]},${alt}`).join(' ');

            kmlContent += `
    <Placemark>
      <name>Línea ${index + 1}</name>
      <ExtendedData>
        <Data name="cameraTriggerDistance"><value>${dist}</value></Data>
        <Data name="speed"><value>${speed}</value></Data>
      </ExtendedData>
      <LineString>
        <altitudeMode>relativeToGround</altitudeMode>
        <coordinates>${kmlCoords}</coordinates>
      </LineString>
    </Placemark>`;
        });

        kmlContent += `\n  </Document>\n</kml>`;

        const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mision_dji_survey.kml';
        a.click();
    }

    function resetApp() {
        coords = [];
        polygonLayer.setLatLngs([]);
        flightLinesLayer.clearLayers();
    }
</script>

</body>
</html>
